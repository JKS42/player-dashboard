name: CI

# Fast sanity checks on every push and pull request: install dependencies,
# regenerate icons, and syntax-check all application JavaScript.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  check:
    name: Lint & syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build icons
        run: npm run build:icons

      - name: Syntax-check JavaScript
        run: |
          set -e
          files=$(find . -name '*.js' \
            -not -path './node_modules/*' \
            -not -path './dist/*' \
            -not -path './assets/generated/*')
          echo "Checking:"
          echo "$files"
          for f in $files; do
            node --check "$f"
          done
          echo "All JS files passed node --check."
