name: Build & Release

# Builds installers for Windows, macOS, and Linux and publishes them to a
# GitHub Release. Triggered by pushing a version tag (e.g. v1.0.1), or manually
# from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # required to create/upload the GitHub Release

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # electron-builder reads the target OS from the runner. --publish always
      # creates/updates a draft GitHub Release and uploads the artifacts to it.
      # NOTE: these builds are UNSIGNED. To enable code signing later, add the
      # relevant secrets and pass them as env vars here (Windows: CSC_LINK +
      # CSC_KEY_PASSWORD; macOS: CSC_LINK + CSC_KEY_PASSWORD + APPLE_ID +
      # APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID, and remove the
      # CSC_IDENTITY_AUTO_DISCOVERY line below). Do NOT pass empty CSC_LINK -
      # electron-builder treats "" as a missing cert file and fails.
      - name: Build & publish (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run dist:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & publish (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run dist:mac -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false # skip signing for the unsigned build

      - name: Build & publish (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run dist:linux -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Always keep a copy of the installers as workflow artifacts too, so they
      # are downloadable even for manual (non-tag) runs that don't publish.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
